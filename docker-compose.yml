# Entorno 100% en Docker: Python, Django y MySQL viven en contenedores.
# En el Mac solo se necesita Docker Desktop (y VS Code para editar).
name: proyecto_bd

services:
  db:
    image: mysql:8.0
    container_name: proyecto_bd_mysql
    environment:
      MYSQL_DATABASE: bd_productos
      MYSQL_USER: django
      MYSQL_PASSWORD: django123
      MYSQL_ROOT_PASSWORD: root123
    volumes:
      - mysql_data:/var/lib/mysql          # los datos viven en un volumen de Docker, no en el Mac
    ports:
      - "127.0.0.1:3307:3306"              # opcional: para conectarse con un cliente externo
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: proyecto_bd_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root123
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    container_name: proyecto_bd_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: bd_productos
      DB_USER: django
      DB_PASSWORD: django123
    volumes:
      - .:/app                             # solo el código se comparte, para editarlo en VS Code
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
