<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Login</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    </head>
    <body>

        <div class="container text-center" style="max-width:450px">
            <h1>Iniciar Sesión</h1>

            {% if form.errors %}
                <div class="alert alert-danger">Usuario o contraseña incorrectos</div>
            {% endif %}

            <form action="/login" method="post">
                {% csrf_token %}

                <input type="text" name="username" placeholder="Usuario" required autofocus class="form-control form-control-lg" />

                <br/>

                <input type="password" name="password" placeholder="Contraseña" required class="form-control form-control-lg" />

                <br/>

                <input type="hidden" name="next" value="{{ next }}" />
                <input type="submit" value="Ingresar" class="btn btn-primary btn-lg" style="width:100%"/>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    </body>
</html>
