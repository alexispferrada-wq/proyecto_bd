<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Menú Principal - Proyecto BD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .main-card {
            max-width: 520px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
        }
        .btn-menu {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn-menu:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="main-card p-4 p-md-5">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'success' }} alert-dismissible fade show small d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>{{ message }}</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="text-center mb-4">
            <div class="display-6 text-primary mb-2">
                <i class="bi bi-speedometer2"></i>
            </div>
            <h2 class="fw-bold mb-1">Menú Principal</h2>
            <div class="d-inline-flex align-items-center bg-light px-3 py-1 rounded-pill mt-2">
                <i class="bi bi-person-circle text-primary me-2"></i>
                <span class="text-secondary small">Conectado como: <strong class="text-dark">{{ user.username }}</strong></span>
            </div>
        </div>

        <div class="d-grid gap-3 mb-4">
            <a href="/form_registrar" class="btn btn-primary btn-lg btn-menu py-3 text-start d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <i class="bi bi-plus-circle-fill fs-3 me-3"></i>
                    <div>
                        <div class="fw-bold">Registrar Producto</div>
                        <small class="text-white-50">Agregar un nuevo artículo al catálogo</small>
                    </div>
                </div>
                <i class="bi bi-chevron-right"></i>
            </a>

            <a href="/listado" class="btn btn-dark btn-lg btn-menu py-3 text-start d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <i class="bi bi-table fs-3 me-3 text-info"></i>
                    <div>
                        <div class="fw-bold">Listado de Productos</div>
                        <small class="text-white-50">Ver, editar y eliminar registros (CRUD)</small>
                    </div>
                </div>
                <span class="badge bg-secondary rounded-pill">{{ total_productos }}</span>
            </a>
        </div>

        <div class="text-center pt-3 border-top">
            <form action="/logout" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm px-4">
                    <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
