<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Actualizar Producto - Proyecto BD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .form-card {
            max-width: 500px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="form-card p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h3 class="fw-bold mb-0">
                <i class="bi bi-pencil-square text-warning me-2"></i>Editar Producto
            </h3>
            <span class="badge bg-secondary">ID #{{ producto.id }}</span>
        </div>

        <p class="text-muted small mb-4">Modifica los datos del producto seleccionado y guarda los cambios.</p>

        <form action="/actualizar/{{ producto.id }}" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Nombre del Producto</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-tag"></i></span>
                    <input type="text" name="txtnom" value="{{ producto.nombre }}" placeholder="Nombre del Producto" required class="form-control" />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Marca</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-building"></i></span>
                    <select name="cbomar" required class="form-select">
                        <option value="">-- Seleccione una marca --</option>
                        <option value="A cuenta" {% if producto.marca == "A cuenta" %}selected{% endif %}>A cuenta</option>
                        <option value="Jumbo" {% if producto.marca == "Jumbo" %}selected{% endif %}>Jumbo</option>
                        <option value="Lider" {% if producto.marca == "Lider" %}selected{% endif %}>Lider</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Precio (CLP)</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-currency-dollar"></i></span>
                    <input type="number" name="txtpre" value="{{ producto.precio }}" min="1" max="9999999" placeholder="Precio" required class="form-control" />
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-warning text-dark py-2 fw-semibold">
                    <i class="bi bi-check2-circle me-1"></i> Actualizar Cambios
                </button>
                <a href="/listado" class="btn btn-light border py-2 text-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Cancelar y Volver
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
