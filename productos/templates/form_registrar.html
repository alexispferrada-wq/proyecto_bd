<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Registrar Producto - Proyecto BD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .form-card {
            max-width: 500px;
            width: 100%;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="form-card p-4 p-md-5">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h3 class="fw-bold mb-0">
                <i class="bi bi-plus-circle text-primary me-2"></i>Nuevo Producto
            </h3>
            <a href="/" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-house me-1"></i>Menú
            </a>
        </div>

        <p class="text-muted small mb-4">Completa los campos para registrar un nuevo artículo en la base de datos.</p>

        <form action="/registrar" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Nombre del Producto</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-tag"></i></span>
                    <input type="text" name="txtnom" placeholder="Ej: Arroz Grado 1" required autofocus class="form-control" />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">Marca</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-building"></i></span>
                    <select name="cbomar" required class="form-select">
                        <option value="">-- Seleccione una marca --</option>
                        <option value="A cuenta">A cuenta</option>
                        <option value="Jumbo">Jumbo</option>
                        <option value="Lider">Lider</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">Precio (CLP)</label>
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="bi bi-currency-dollar"></i></span>
                    <input type="number" name="txtpre" min="1" max="9999999" placeholder="Ej: 1490" required class="form-control" />
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary py-2 fw-semibold">
                    <i class="bi bi-save me-1"></i> Guardar Producto
                </button>
                <a href="/listado" class="btn btn-light border py-2 text-secondary">
                    <i class="bi bi-list-ul me-1"></i> Ir al Listado
                </a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
