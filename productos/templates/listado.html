<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Listado</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

        <script>
            const botonEliminar = (id) => {
                if(window.confirm("¿Está Seguro De Querer Eliminar El Registro?")){
                    window.location.href = "/eliminar/" + id;
                }
            }
        </script>

    </head>
    <body>

        <div class="container text-center">
            <h1>Listado de Productos</h1>
            <h4><a href="/">Volver al Index</a></h4>


            <table border="1" class="table table-hover">
                <tr bgcolor="lightgray">
                    <th>ID</th>
                    <th>NOMBRE</th>
                    <th>MARCA</th>
                    <th>PRECIO</th>
                    <th>EDITAR</th>
                    <th>ELIMINAR</th>
                </tr>

                {% for p in productos %}
                <tr class="align-middle">
                    <td>{{ p.id }}</td>
                    <td>{{ p.nombre }}</td>
                    <td>{{ p.marca }}</td>
                    <td>{{ p.precio }}</td>
                    <td>
                        <a href="/form_actualizar/{{ p.id }}" class="btn btn-lg">
                            <i class="bi bi-pencil-fill"></i>
                        </a>
                    </td>
                    <td>
                        <button type="button" onClick="botonEliminar({{ p.id }})" class="btn btn-lg">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </td>
                </tr>
                {% empty %}
                <tr><td colspan="6">No hay productos registrados</td></tr>
                {% endfor %}

            </table>


        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    </body>
</html>
